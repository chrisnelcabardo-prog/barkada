<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise</title>

<style>
body{
    font-family: Arial, sans-serif;
    text-align:center;
    background:#87CEEB;
    overflow:hidden;
}

.page{
    display:none;
    margin-top:100px;
}

.active{
    display:block;
}

#gift{
    font-size:150px;
    cursor:pointer;
}

.balloon{
    position:absolute;
    font-size:50px;
    animation:float 8s linear infinite;
}

@keyframes float{
    from{
        transform:translateY(100vh);
    }
    to{
        transform:translateY(-120vh);
    }
}

button{
    padding:12px 25px;
    font-size:18px;
    cursor:pointer;
    margin:10px;
}

#yesBtn{
    position:absolute;
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div id="page1" class="page active">
    <h1>🎉 Happy Birthday Cassius! 🎉</h1>
    <div id="gift" onclick="openGift()">🎁</div>
    <p> 18 Kana pwede kana makulong </p>
    <p>Click the gift box!</p>
</div>

<!-- PAGE 2 -->
<div id="page2" class="page">
    <h1>🎈 Surprise! 🎈</h1>
    <p>Wishing you happiness, success, and lots of fun!</p>

    <button onclick="showQuestion()">Continue</button>
</div>

<!-- PAGE 3 -->
<div id="page3" class="page">
    <h1>💰 Do you want money?</h1>

    <button id="yesBtn">YES</button>
    <button onclick="niceDay()">NO</button>

    <p id="counter"></p>
</div>

<!-- PAGE 4 -->
<div id="page4" class="page">
    <h1>😎 Have a nice day!</h1>
    <p>And Happy Birthday! 🎂</p>
</div>

<script>

let yesClicks = 0;

function showPage(id){
    document.querySelectorAll(".page").forEach(page=>{
        page.classList.remove("active");
    });

    document.getElementById(id).classList.add("active");
}

function openGift(){

    showPage("page2");

    for(let i=0;i<20;i++){

        let balloon = document.createElement("div");

        balloon.className = "balloon";
        balloon.innerHTML = "🎈";

        balloon.style.left = Math.random()*100 + "vw";
        balloon.style.animationDuration =
            (5 + Math.random()*5) + "s";

        document.body.appendChild(balloon);
    }
}

function showQuestion(){
    showPage("page3");
}

const yesBtn = document.getElementById("yesBtn");

yesBtn.addEventListener("mouseover", ()=>{

    yesBtn.style.left =
        Math.random()*(window.innerWidth-150)+"px";

    yesBtn.style.top =
        Math.random()*(window.innerHeight-100)+"px";
});

yesBtn.addEventListener("click", ()=>{

    yesClicks++;

    document.getElementById("counter").innerHTML =
        "Money loading... " + yesClicks + "/7";

    if(yesClicks >= 7){

        yesBtn.innerHTML = "💥 BROKEN";

        yesBtn.disabled = true;

        yesBtn.style.background = "gray";
    }
});

function niceDay(){
    showPage("page4");
}

</script>

</body>
</html>
